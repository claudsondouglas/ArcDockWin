[package]
name = "arcdockwin"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Dock e barra de menus no estilo do macOS para o Windows 11"

[dependencies]
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Controls", "Win32_UI_Accessibility","Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_System_Variant", "Win32_System_Com_StructuredStorage", "Win32_System_Registry", "UI_Composition", "UI_Composition_Desktop", "System", "Foundation_Numerics", "Win32_System_WinRT", "Win32_System_WinRT_Composition", "Win32_Security", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_Memory", "Devices_Radios", "Devices_Bluetooth", "Devices_Enumeration", "Win32_Devices_Bluetooth", "Win32_System_Diagnostics_ToolHelp", "Media_Control", "Graphics_Imaging", "Storage_Streams", "Win32_Devices_Display", "Win32_Storage_Xps", "Win32_System_Performance", "Win32_Graphics_Dxgi", "Win32_Networking_WinHttp", "Win32_Security_Cryptography"] }
serde_json = "1"
windows-numerics = "0.3"
windows-core = "0.62"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
